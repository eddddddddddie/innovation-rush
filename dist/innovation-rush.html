<title>Innovation Rush</title>
<meta name="description" content="Lead open innovation at a mining company for three years. A game by Unearthed.">
<style>
/* Layout: a single centred column app. Title scene is an open-pit cross-section; in-game a sticky HUD tracks the 12 quarters as pit benches. */
/* Unearthed brand (unearthed-style): white ground, Arial only, orange headlines, grey body, max three oranges per element, no gradients on UI. Deliberately single light theme per brand guide. */
:root {
  --orange: #FF6600;
  --amber: #FFA627;
  --tangerine: #FC883F;
  --peach: #F8CA8A;
  --peach-soft: #FDEFDC;
  --ink: #333333;
  --grey: #656565;
  --muted: #656565;
  --line: #E0E0E0;
  --bg: #FFFFFF;
  --bg-alt: #F5F5F5;
  --good: #23784A;
  --good-soft: #E6F3EB;
  --bad: #C0392B;
  --bad-soft: #FBEAE8;
  --m-eco: #FF6600;
  --m-adopt: #333333;
  --m-value: #FFA627;
  --m-buyin: #656565;
  --font: Arial, Helvetica, sans-serif;
  --radius: 14px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--grey); }

h1 { font-size: clamp(2.4rem, 7vw, 4rem); color: var(--orange); letter-spacing: -0.035em; }
h2 { font-size: clamp(1.6rem, 4vw, 2.25rem); color: var(--orange); letter-spacing: -0.01em; }
h3 { font-size: 1.1rem; }
p { margin: 0; max-width: 62ch; }
.label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }
.wrap { max-width: 1080px; margin: 0 auto; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-lg { display: flex; flex-direction: column; gap: 28px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

.center p { margin-inline: auto; }
.screen { padding-block: 32px; animation: rise .35s ease both; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 999px; padding: 14px 28px; font-weight: 700; background: var(--orange); color: #fff; min-width: 200px; transition: background .15s, transform .1s; }
.btn:hover { background: #E85C00; }

.btn.ghost { background: transparent; color: var(--orange); box-shadow: inset 0 0 0 2px var(--orange); }
.btn.ghost:hover { background: var(--peach-soft); }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
a { color: var(--orange); font-weight: 700; }

/* Title scene */
.brandline { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 20px; border-bottom: 1px solid var(--line); }
.logo { display: inline-flex; }
.logo img { height: 40px; width: auto; display: block; }
.gamename { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--grey); }
.gamename b { color: var(--orange); }

.scene .pit { position: absolute; inset: 0; width: 100%; height: 100%; }
.scene .m { position: absolute; }

.hero { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 32px; align-items: end; padding-block: 24px 0; }

.companies { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 16px; }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 0.78rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--bg-alt); color: var(--grey); }

/* HUD */
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); margin-inline: -16px; padding: 10px 16px; }
.hud-inner { max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: auto 1fr auto; gap: 8px 20px; align-items: center; }
.hud .who { display: flex; gap: 10px; align-items: center; min-width: 0; }
.hud .who svg { width: 46px; height: 40px; flex: none; }
.hud .who .name { font-weight: 700; color: var(--ink); font-size: 0.95rem; line-height: 1.2; }
.hud .who .co { font-size: 0.8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.benches { display: flex; align-items: flex-start; gap: 3px; justify-self: center; }
.bench-year { display: flex; flex-direction: column; gap: 3px; align-items: center; }
.bench-year .ql { display: flex; gap: 3px; align-items: flex-start; }
.bench { width: 16px; height: 8px; border-radius: 2px; background: var(--bg-alt); border: 1px solid var(--line); }
.bench.done { background: var(--peach); border-color: var(--peach); }

.budget { display: flex; flex-direction: column; gap: 4px; min-width: 150px; }
.budget .amt { font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; font-size: 0.95rem; }

.track { position: relative; height: 8px; border-radius: 999px; background: var(--bg-alt); overflow: hidden; }
.track .fill { position: absolute; inset: 0 auto 0 0; background: var(--orange); border-radius: 999px; transition: width .4s ease; }

.minimetrics { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.mm { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.mm .top { display: flex; justify-content: space-between; font-size: 0.75rem; font-weight: 700; color: var(--ink); gap: 4px; }

/* Planning */
.plan-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: end; }
.notice { background: var(--peach-soft); border-radius: 12px; padding: 14px 16px; color: #7A3A00; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(210px, 100%), 1fr)); gap: 12px; }
.card { text-align: left; background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; padding: 14px; display: flex; gap: 12px; align-items: flex-start; color: inherit; transition: border-color .15s, background .15s; }
.card:hover:not(:disabled) { border-color: var(--tangerine); }

.card .ic .icon { width: 22px; height: 22px; }
.card .txt { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.card .nm { font-weight: 700; color: var(--ink); line-height: 1.25; }
.pips { font-size: 0.8rem; font-weight: 700; letter-spacing: 0.05em; color: var(--orange); }

.card.funded { background: var(--peach-soft); border-color: var(--orange); }

.card .pick { font-size: 0.85rem; color: #7A3A00; }
.card.locked { background: var(--bg-alt); border-style: dashed; }
.card.locked .ic { background: var(--line); color: var(--grey); }

.dock { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); margin-inline: -16px; padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); margin-top: 24px; }
.dock-inner { max-width: 1080px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
.slots { display: flex; gap: 6px; align-items: center; }

.overlay { position: fixed; inset: 0; background: rgba(51, 51, 51, .45); display: grid; place-items: center; padding: 16px; z-index: 20; animation: fade .15s ease; }
@keyframes fade { from { opacity: 0; } }
.modal { background: var(--bg); border-radius: 18px; width: 100%; max-width: 560px; max-height: calc(100% - 32px); overflow: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
.modal-head { display: flex; gap: 12px; align-items: center; }

.modal-head .ic .icon { width: 24px; height: 24px; }
.modal-head h2 { font-size: 1.4rem; flex: 1; }
.x { background: var(--bg-alt); border: 0; border-radius: 999px; width: 36px; height: 36px; font-size: 1.2rem; color: var(--grey); flex: none; }
.opts { display: flex; flex-direction: column; gap: 8px; border: 0; margin: 0; padding: 0; }

.opt:hover { border-color: var(--tangerine); }
.opt input { accent-color: var(--orange); width: 18px; height: 18px; margin: 0; }

.opt.sel { border-color: var(--orange); background: var(--peach-soft); }
.opt.no { opacity: .55; }
.warn { color: var(--bad); font-weight: 700; font-size: 0.9rem; }

/* Event + outcome */
.panel { border: 1.5px solid var(--line); border-radius: 18px; padding: clamp(20px, 4vw, 36px); display: flex; flex-direction: column; gap: 18px; }
.panel .lead { font-size: 1.1rem; color: var(--ink); }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choice { text-align: left; padding: 16px 18px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); font-weight: 700; line-height: 1.35; transition: border-color .15s, background .15s; }
.choice:hover { border-color: var(--tangerine); }
.choice[aria-pressed="true"] { border-color: var(--orange); background: var(--peach-soft); }
.quote { border-left: 4px solid var(--orange); padding-left: 16px; color: var(--ink); font-size: 1.1rem; }
.deltas { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.delta { border-radius: 12px; background: var(--bg-alt); padding: 12px; display: flex; flex-direction: column; gap: 2px; border-top: 4px solid var(--c); min-width: 0; }
.delta .v { font-size: 1.6rem; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.1; }
.delta .d { font-weight: 700; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.d.up { color: var(--good); } .d.down { color: var(--bad); } .d.flat { color: var(--muted); }

.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--font); font-size: 11px; fill: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.85rem; color: var(--ink); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 18px; height: 3px; border-radius: 2px; background: var(--c); display: inline-block; }
.legend i.dash { background: none; border-top: 3px dashed var(--c); height: 0; }

.score-hero { display: grid; grid-template-columns: 180px 1fr; gap: 28px; align-items: center; }
.score-hero .portrait svg { width: 180px; height: auto; }
.big { font-size: clamp(3.5rem, 12vw, 5.5rem); font-weight: 700; color: var(--orange); line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.stats { display: flex; flex-wrap: wrap; gap: 28px; }

.drv .nm { font-weight: 700; color: var(--ink); font-size: 0.92rem; }

.tip b { color: var(--ink); }
.decisions { display: flex; flex-direction: column; }

.dec .what { color: var(--ink); font-weight: 700; }
.dec .why { grid-column: 1 / -1; font-size: 0.92rem; }
.dec .when { font-size: 0.8rem; color: var(--muted); font-weight: 400; }
.cta { background: var(--orange); color: #fff; border-radius: 18px; padding: clamp(24px, 5vw, 40px); display: flex; flex-direction: column; gap: 12px; }
.cta h2 { color: #fff; }
.cta p { color: #fff; }
.cta img { height: 36px; width: auto; align-self: flex-start; filter: brightness(0) invert(1); }

@media (max-width: 640px) {

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

<script>
// Innovation Rush: game data and engine. Pure logic, no DOM, so it can be balance-tested in Node.

const NODES = {
  prob: 'Problem clarity',
  safe: 'Safety to experiment',
  data: 'Data and site access',
  path: 'Pilot-to-production pathway',
  reach: 'Ecosystem reach',
  champ: 'Site champions',
  trust: 'Innovator trust',
  focus: 'Portfolio focus',
};

const NODE_TIPS = {
  prob: 'Start with well-defined operational problems. Workshop them with site teams and measure against site KPIs.',
  safe: 'Make it safe to try and fail. Share lessons from closed pilots and never punish a well-run experiment.',
  data: 'Give innovators real data and site access through a secure sandbox and decent connectivity.',
  path: 'Build a path from pilot to production: light procurement, scale-up budgets and an exec owner.',
  reach: 'Take your problems to the global ecosystem through open challenges, consortia and scouting partners.',
  champ: 'Give site champions time and KPIs, and design trials with operators rather than around them.',
  trust: 'Treat innovators fairly: fair IP terms, fast payment, and a reply to every submission.',
  focus: 'Fund fewer things, with clear kill criteria. Measure value, not activity.',
};

const METRICS = [
  { id: 'eco', name: 'Ecosystem', desc: 'Innovators, researchers and partners working on your problems', w: { reach: 0.4, trust: 0.35, prob: 0.25 } },
  { id: 'adopt', name: 'Adoption', desc: 'Pilots that make it into production across your sites', w: { path: 0.3, champ: 0.3, safe: 0.15, data: 0.15, focus: 0.1 } },
  { id: 'value', name: 'Value', desc: 'Measured cost, safety, productivity and emissions impact', w: { prob: 0.3, focus: 0.3, path: 0.2, data: 0.2 } },
  { id: 'buyin', name: 'Buy-in', desc: 'How much site leaders trust and back your innovation team', w: { champ: 0.4, safe: 0.2, focus: 0.2, prob: 0.2 } },
];

const COMPANIES = [
  {
    id: 'junior', name: 'Lucky Strike Resources', size: 'Junior explorer', budget: 4, mascot: 'nugget', difficulty: 'Gentle',
    blurb: 'A 40-person explorer sitting on one promising lithium deposit. Not much money, not much bureaucracy, lots of ambition.',
    welcome: [
      'We found lithium! Now we need to work out how to mine it smarter than the majors, on a fraction of their budget.',
      'Our team is small and everyone knows everyone, but we have never worked with startups or run a pilot.',
      'Show us how open innovation can help a small miner punch above its weight.',
    ],
    nodes: { prob: 50, safe: 60, data: 45, path: 55, reach: 38, champ: 65, trust: 50, focus: 55 },
    drag: {},
  },
  {
    id: 'mid', name: 'Copper Canyon Mining', size: 'Mid-tier producer', budget: 20, mascot: 'truck', difficulty: 'Moderate',
    blurb: 'Two open-pit copper mines and a concentrator. Margins are tight, ore grades are falling and the board wants new ideas.',
    welcome: [
      'Our grades are dropping, energy costs are climbing and our haul fleet is getting old.',
      'We have run a few pilots before. Most of them quietly died once the vendor demo was over.',
      'We need you to turn innovation from a side hobby into something our sites actually rely on.',
    ],
    nodes: { prob: 48, safe: 50, data: 50, path: 46, reach: 50, champ: 50, trust: 50, focus: 48 },
    drag: { champ: -0.4 },
  },
  {
    id: 'major', name: 'Big Rocks', size: 'Global major', budget: 120, mascot: 'mammoth', difficulty: 'Brutal',
    blurb: 'Thirty sites on four continents, a famous brand and a big budget. Also seven approval committees and a long memory.',
    welcome: [
      'We have an innovation lab, a venture fund and a very nice video about the future of mining.',
      'What we do not have is many new technologies running on our sites. Startups say we are slow and hard to work with.',
      'You have the budget. Can you get this mammoth moving before the board loses patience?',
    ],
    nodes: { prob: 44, safe: 40, data: 50, path: 34, reach: 62, champ: 40, trust: 42, focus: 38 },
    drag: { path: -1.1, safe: -0.6, champ: -0.3 },

      { t: 'Rename pilots "proofs of value"', e: { focus: -2 }, r: 'Audit was not fooled.' },
    ],
  },
];

const YEARS = 3;
const QUARTERS = 4;
const MAX_PER_YEAR = 3;
const INIT_SCALE = 0.85;
const FIRE_BELOW = 35;

const clamp = (v, lo = 0, hi = 100) => Math.max(lo, Math.min(hi, v));

function metricsFrom(nodes) {
  const out = {};
  for (const m of METRICS) {
    let s = 0;
    for (const k in m.w) s += m.w[k] * nodes[k];
    out[m.id] = clamp(20 + 0.8 * s);
  }
  return out;
}

const avg = (ms) => METRICS.reduce((s, m) => s + ms[m.id], 0) / METRICS.length;

function tier(score) {
  if (score >= 90) return { id: 'elite', name: 'Elite', award: 'The Mother Lode' };
  if (score >= 75) return { id: 'high', name: 'High', award: 'A Rich Vein' };
  if (score >= 55) return { id: 'medium', name: 'Medium', award: 'Low-Grade Ore' };
  return { id: 'low', name: 'Low', award: 'Straight to Tailings' };
}

function shuffle(a, rnd = Math.random) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function newGame(companyId, player, rnd = Math.random) {
  const co = COMPANIES.find((c) => c.id === companyId);
  const nodes = { ...co.nodes };
  const m0 = metricsFrom(nodes);
  return {
    player, companyId, nodes, budget: 100,
    funded: [], // { id, opt, year }
    year: 1, quarter: 0, // quarter 0 = planning
    history: [m0],
    deck: shuffle(EVENTS.map((e) => e.id), rnd).slice(0, YEARS * QUARTERS),
    log: [], // { year, quarter, event, choice }
    status: 'playing',
  };
}

const company = (s) => COMPANIES.find((c) => c.id === s.companyId);
const initById = (id) => INITIATIVES.find((i) => i.id === id);
const eventById = (id) => EVENTS.find((e) => e.id === id);
const fundedThisYear = (s) => s.funded.filter((f) => f.year === s.year);

function canFund(s, id, opt) {
  if (s.funded.some((f) => f.id === id)) return false;
  if (fundedThisYear(s).length >= MAX_PER_YEAR) return false;
  return initById(id).opts[opt].c <= s.budget + 1e-9;
}

function fund(s, id, opt) {
  if (!canFund(s, id, opt)) return false;
  s.budget = clamp(s.budget - initById(id).opts[opt].c, 0, 999);
  s.funded.push({ id, opt, year: s.year });
  return true;
}

function unfund(s, id) {
  const i = s.funded.findIndex((f) => f.id === id && f.year === s.year);
  if (i < 0) return;
  s.budget += initById(s.funded[i].id).opts[s.funded[i].opt].c;
  s.funded.splice(i, 1);
}

function currentEvent(s) {
  return eventById(s.deck[(s.year - 1) * QUARTERS + (s.quarter - 1)]);
}

function startYear(s) {
  s.quarter = 1;
}

// Resolve the quarter's event choice, then let funded initiatives and company drag play out.
function playQuarter(s, choiceIdx) {
  const ev = currentEvent(s);
  const ch = ev.choices[choiceIdx];
  const before = s.history[s.history.length - 1];
  for (const k in ch.e) s.nodes[k] = clamp(s.nodes[k] + ch.e[k]);
  if (ch.b) s.budget = clamp(s.budget + ch.b, 0, 999);
  for (const f of s.funded) {
    const e = initById(f.id).opts[f.opt].e;
    for (const k in e) s.nodes[k] = clamp(s.nodes[k] + e[k] * INIT_SCALE);
  }
  const drag = company(s).drag;
  for (const k in drag) s.nodes[k] = clamp(s.nodes[k] + drag[k]);
  const after = metricsFrom(s.nodes);
  s.history.push(after);
  s.log.push({ year: s.year, quarter: s.quarter, event: ev.id, choice: choiceIdx });
  if (avg(after) < FIRE_BELOW) s.status = 'fired';
  else if (s.quarter === QUARTERS) {
    if (s.year === YEARS) s.status = 'done';
    else { s.year += 1; s.quarter = 0; }
  } else s.quarter += 1;
  return { ev, ch, before, after };
}

// Rough quality of a choice for the debrief: driver changes weighted by how much each driver feeds the metrics.
const NODE_WEIGHT = (() => {
  const w = {};
  for (const k in NODES) w[k] = 0;
  for (const m of METRICS) for (const k in m.w) w[k] += m.w[k];
  return w;
})();

function impact(e) {
  let s = 0;
  for (const k in e) s += e[k] * NODE_WEIGHT[k];
  return s;
}

const ENGINE = {
  NODES, NODE_TIPS, METRICS, COMPANIES, INITIATIVES, EVENTS, YEARS, QUARTERS, MAX_PER_YEAR, FIRE_BELOW,
  metricsFrom, avg, tier, newGame, company, initById, eventById, fundedThisYear, canFund, fund, unfund,
  currentEvent, startYear, playQuarter, impact, shuffle,
};

if (typeof module !== 'undefined') module.exports = ENGINE;

// Innovation Rush: screens and interaction. Renders the whole app from state on every change.
(() => {
  const E = ENGINE, A = ART;

  const MHEX = { eco: '#FF6600', adopt: '#333333', value: '#FFA627', buyin: '#656565' };

  let S = null; // engine game state
  let V = { view: 'title', name: '', companyId: null, modal: null, pending: null, order: null, outcome: null };

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const coById = (id) => E.COMPANIES.find((c) => c.id === id);
  const co = () => coById(S ? S.companyId : V.companyId);
  const mascot = (id, mood) => A.MASCOTS[coById(id).mascot](mood);
  const latest = () => S.history[S.history.length - 1];
  const money = (pct) => {
    const m = (Math.abs(pct) / 100) * co().budget;
    if (m >= 1) return `$${m >= 10 ? Math.round(m) : m.toFixed(1).replace(/\.0$/, '')}M`;
    return `$${Math.round(m * 1000)}K`;
  };
  const pips = (init) => {
    const max = Math.max(...init.opts.map((o) => o.c));
    const n = max <= 10 ? 1 : max <= 25 ? 2 : max <= 40 ? 3 : 4;
    return `<span class="pips" aria-label="Cost level ${n} of 4">${'$'.repeat(n)}<i>${'$'.repeat(4 - n)}</i></span>`;
  };
  const sign = (d) => {
    const r = Math.round(d);
    if (r === 0) return `<span class="d flat">no change</span>`;
    return `<span class="d ${r > 0 ? 'up' : 'down'}">${r > 0 ? '+' : '−'}${Math.abs(r)}</span>`;
  };

  const store = {
    get() { try { return JSON.parse(localStorage.getItem(BEST_KEY)) || {}; } catch { return {}; } },
    set(companyId, score) {
      try {
        const b = store.get();
        if (!(b[companyId] >= score)) { b[companyId] = score; localStorage.setItem(BEST_KEY, JSON.stringify(b)); }
      } catch { /* storage unavailable */ }

  const brandline = () => `<header class="brandline"><a class="logo" href="https://unearthed.solutions" target="_blank" rel="noopener"><img src="${LOGO}" alt="Unearthed"></a><span class="gamename"><b>Innovation Rush</b> · A game by Unearthed</span></header>`;

  function hud() {
    const c = co();
    const played = S.log.length;
    const years = [1, 2, 3].map((y) => {
      const qs = [1, 2, 3, 4].map((q) => {
        const i = (y - 1) * 4 + (q - 1);
        const cls = i < played ? 'done' : i === played && S.quarter > 0 && V.view === 'event' ? 'now' : '';
        return `<span class="bench ${cls}" style="margin-top:${(q - 1) * 3}px"></span>`;
      }).join('');
      return `<div class="bench-year"><div class="ql">${qs}</div><span class="yl">Y${y}</span></div>`;
    }).join('');
    let fill = S.budget, ghost = S.budget;
    if (V.modal && V.pending != null) {
      const init = E.initById(V.modal);
      const cur = S.funded.find((f) => f.id === V.modal && f.year === S.year);
      const after = S.budget + (cur ? init.opts[cur.opt].c : 0) - init.opts[V.pending].c;
      fill = Math.min(after, S.budget); ghost = Math.max(after, S.budget);
    }
    const m = latest();
    const where = S.quarter === 0 ? `Year ${S.year}, planning` : `Year ${S.year}, quarter ${S.quarter}`;
    return `<div class="hud"><div class="hud-inner">
      <div class="who">${mascot(S.companyId)}<div style="min-width:0"><div class="name">${esc(S.player)}</div><div class="co">Chief Innovation Officer, ${c.name}</div></div></div>
      <div class="benches" role="img" aria-label="${where}. ${played} of 12 quarters played.">${years}</div>
      <div class="budget"><div class="amt">${money(S.budget)} <small>left of $${c.budget}M</small></div>
        <div class="track"><div class="ghost" style="width:${Math.min(100, Math.max(0, ghost))}%"></div><div class="fill" style="width:${Math.min(100, Math.max(0, fill))}%"></div></div></div>
      <div class="minimetrics">${E.METRICS.map((mt) => `<div class="mm" style="--c:${MCOL[mt.id]}"><div class="top"><span>${mt.name}</span><span>${Math.round(m[mt.id])}</span></div><div class="track"><div class="fill" style="width:${m[mt.id]}%"></div></div></div>`).join('')}</div>
    </div></div>`;
  }

  function chart(hist) {
    const W = 600, H = 250, L = 34, R = W - 12, T = 14, B = H - 30;
    const x = (i) => L + ((R - L) * i) / 12;
    const y = (v) => B - ((B - T) * v) / 100;
    let g = '';
    for (const v of [0, 25, 50, 75, 100]) g += `<line x1="${L}" x2="${R}" y1="${y(v)}" y2="${y(v)}" stroke="#EFE9E3"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
    for (const q of [4, 8]) g += `<line x1="${x(q)}" x2="${x(q)}" y1="${T}" y2="${B}" stroke="#E8E1DA"/>`;
    for (let q = 0; q <= 12; q++) g += `<line x1="${x(q)}" x2="${x(q)}" y1="${B}" y2="${B + 4}" stroke="#C9C0B8"/>`;
    [['Year 1', 2], ['Year 2', 6], ['Year 3', 10]].forEach(([t, q]) => { g += `<text x="${x(q)}" y="${B + 20}" text-anchor="middle">${t}</text>`; });
    g += `<line x1="${L}" x2="${R}" y1="${y(90)}" y2="${y(90)}" stroke="#FF6600" stroke-dasharray="5 4" opacity=".7"/><text x="${R - 4}" y="${y(90) - 6}" text-anchor="end" style="fill:#B84A00">Win: average 90+</text>`;
    g += `<line x1="${L}" x2="${R}" y1="${y(E.FIRE_BELOW)}" y2="${y(E.FIRE_BELOW)}" stroke="#C0392B" stroke-dasharray="5 4" opacity=".6"/><text x="${R - 4}" y="${y(E.FIRE_BELOW) + 15}" text-anchor="end" style="fill:#C0392B">Fired: average below ${E.FIRE_BELOW}</text>`;
    for (const mt of E.METRICS) {
      const pts = hist.map((h, i) => `${x(i).toFixed(1)},${y(h[mt.id]).toFixed(1)}`).join(' ');
      const dash = mt.id === 'buyin' ? ' stroke-dasharray="6 4"' : '';
      g += `<polyline points="${pts}" fill="none" stroke="${MHEX[mt.id]}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"${dash}/>`;
      hist.forEach((h, i) => {
        const last = i === hist.length - 1;
        g += `<circle cx="${x(i).toFixed(1)}" cy="${y(h[mt.id]).toFixed(1)}" r="${last ? 4.5 : 2.6}" fill="${last ? MHEX[mt.id] : '#fff'}" stroke="${MHEX[mt.id]}" stroke-width="2"/>`;
      });
    }
    const lastM = hist[hist.length - 1];
    const label = E.METRICS.map((mt) => `${mt.name} ${Math.round(lastM[mt.id])}`).join(', ');
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Metrics by quarter. Latest: ${label}.">${g}</svg>
      <div class="legend">${E.METRICS.map((mt) => `<span><i class="${mt.id === 'buyin' ? 'dash' : ''}" style="--c:${MHEX[mt.id]}"></i>${mt.name}</span>`).join('')}</div>`;
  }

  // ---------- screens ----------

  const views = {
    title() {
      const best = store.get();
      const bestAny = Math.max(0, ...Object.values(best));
      return `<div class="wrap">${brandline()}
        <section class="screen stack-lg">
          <div class="hero">
            <div class="stack">
              <span class="label">A game for mining innovation leaders</span>
              <h1>Innovation Rush</h1>

              <button class="btn" data-a="start">Start your tenure</button>
              <span class="hint">${bestAny ? `Your best score so far: ${Math.round(bestAny)}%` : 'About 10 minutes. Built on what works in real mining open innovation programs.'}</span>

          </div>
          <div class="scene">${A.pit()}
            <div class="m m-nugget">${A.MASCOTS.nugget()}</div>

    },

    name() {
      return `<div class="wrap">${brandline()}
        <section class="screen stack-lg">
          <h2>First, what should we call you?</h2>
          <form class="field" id="nameform" novalidate>
            <label for="player">Your name</label>
            <input id="player" maxlength="24" autocomplete="nickname" value="${esc(V.name)}" placeholder="e.g. Alex">

    },

    company() {
      const best = store.get();
      return `<div class="wrap">${brandline()}
        <section class="screen stack-lg">
          <div class="stack"><span class="label">Three job offers</span><h2>Which mining company will you join?</h2>
          <p>Your track record has three companies competing for you. Bigger companies have bigger budgets, and bigger problems.</p></div>
          <div class="companies">${E.COMPANIES.map((c) => `

                <p>${c.blurb}</p>

              </div>
            </button>`).join('')}
          </div>
          <div class="row" style="justify-content:center"><button class="btn" data-a="accept" ${V.companyId ? '' : 'disabled'}>${V.companyId ? `Join ${coById(V.companyId).name}` : 'Pick a company'}</button></div>
        </section></div>`;
    },

    welcome() {
      const c = co();
      return `<div class="wrap">${brandline()}
        <section class="screen stack-lg">
          <div class="letter">
            <div class="portrait">${mascot(c.id)}</div>
            <div class="copy">
              <span class="label">A message from the board</span>
              <h2>Welcome to ${c.name}, ${esc(S.player)}!</h2>

            </div>

          <div class="stack">
            <h3>How it works</h3>
            <div class="steps">
              <div class="step"><span class="n">01</span><b>Fund initiatives</b><span>At the start of each year, fund up to three. They keep working until you leave.</span></div>

            <p>Average <b>90 or more</b> across all four when your three years are up to win. If the average drops below <b>${E.FIRE_BELOW}</b> at any point, the board will ask for your hard hat back.</p>

    },

    plan() {
      const y = S.year;
      const mine = E.fundedThisYear(S);
      const full = mine.length >= E.MAX_PER_YEAR;
      const notice = y === 1
        ? `Your $${co().budget}M budget has to last all three years. Initiatives start paying off in the first quarter after you fund them and keep working until your tenure ends, so early bets have longer to pay back.`
        : `Year ${y - 1} is done. You have ${money(S.budget)} left to cover ${y === 3 ? 'your final year' : 'the next two years'}. Initiatives you already funded keep running.`;
      const cards = E.INITIATIVES.map((init) => {
        const f = S.funded.find((x) => x.id === init.id);
        if (f && f.year < y) {
          return `<button class="card locked" disabled><span class="ic">${A.icon(init.icon)}</span><span class="txt"><span class="nm">${init.name}</span><span class="pick">${init.opts[f.opt].t}</span><span class="label">Running since Year ${f.year}</span></span></button>`;
        }
        if (f) {
          return `<button class="card funded" data-a="card" data-id="${init.id}"><span class="ic">${A.icon(init.icon)}</span><span class="txt"><span class="nm">${init.name}</span><span class="pick">${init.opts[f.opt].t}</span><span class="label" style="color:#B84A00">Funded for Year ${y}. Tap to change</span></span></button>`;
        }
        return `<button class="card ${full ? 'dim' : ''}" data-a="card" data-id="${init.id}" ${full ? 'disabled' : ''}><span class="ic">${A.icon(init.icon)}</span><span class="txt"><span class="nm">${init.name}</span>${pips(init)}</span></button>`;

      const slots = [0, 1, 2].map((i) => `<span class="slot ${i < mine.length ? 'on' : ''}"></span>`).join('');
      return `${hud()}
        <div class="wrap screen stack-lg">
          <div class="plan-head"><div class="stack"><span class="label">Year ${y} of 3 · Planning</span><h2>Choose up to three initiatives for Year ${y}</h2></div></div>
          <div class="notice">${notice}</div>
          <div class="grid">${cards}</div>
        </div>
        <div class="dock"><div class="dock-inner">
          <div class="row"><div class="slots" aria-hidden="true">${slots}</div><span>${mine.length} of 3 picked${full ? '. That is your limit for this year.' : ''}</span></div>
          <button class="btn" data-a="startYear">Start Year ${y}</button>
        </div></div>
        ${V.modal ? modal() : ''}`;
    },

    event() {
      const ev = E.currentEvent(S);
      return `${hud()}
        <div class="wrap screen stack-lg">
          <div class="panel">
            <span class="label">Year ${S.year} · Quarter ${S.quarter} · Something happened</span>
            <h2>${ev.title}</h2>
            <p class="lead">${ev.body}</p>
            <div class="choices" role="group" aria-label="Your response">
              ${V.order.map((i) => `<button class="choice" id="choice-${i}" data-a="choose" data-i="${i}" aria-pressed="${V.pending === i}">${ev.choices[i].t}</button>`).join('')}
            </div>
            <div><button class="btn" data-a="lock" ${V.pending == null ? 'disabled' : ''}>Lock it in</button></div>
          </div>
        </div>`;
    },

    outcome() {
      const o = V.outcome;
      const ev = E.eventById(o.ev);
      const ch = ev.choices[o.choice];
      const running = S.funded.length;
      const next = S.status === 'fired' ? 'Face the board' : S.status === 'done' ? 'See your scorecard' : S.quarter === 0 ? `Plan Year ${S.year}` : 'Next quarter';
      return `${hud()}
        <div class="wrap screen stack-lg">
          <div class="panel">
            <span class="label">Year ${o.year} · Quarter ${o.quarter} · What happened</span>
            <h2>${ev.title}</h2>
            <p><b style="color:var(--ink)">You chose:</b> ${ch.t}</p>
            <p class="quote">${ch.r}</p>
            ${ch.b ? `<p><span class="chip ${ch.b < 0 ? 'bad' : 'good'}">Budget ${ch.b < 0 ? '−' : '+'}${money(ch.b)}</span></p>` : ''}
            <div class="deltas">${E.METRICS.map((m) => `<div class="delta" style="--c:${MHEX[m.id]}"><span class="t">${m.name}</span><span class="v">${Math.round(o.after[m.id])}</span>${sign(o.after[m.id] - o.before[m.id])}</div>`).join('')}</div>
            <p class="hint">${running ? `These changes include the ${running} initiative${running > 1 ? 's' : ''} you have running.` : 'You have no initiatives running, so only your decision moved the metrics this quarter.'}</p>
          </div>
          <div class="stack"><h3>Your metrics so far</h3>${chart(S.history)}</div>
          <div><button class="btn" data-a="next">${next}</button></div>
        </div>`;
    },

    end() {
      const fired = S.status === 'fired';
      const last = latest();
      const score = E.avg(last);
      const t = E.tier(score);
      const best = store.get()[S.companyId] || 0;
      const verdicts = {
        elite: 'Your sites are adopting new technology, innovators want to work with you and the board can see the value. That is open innovation working.',
        high: 'Solid work. Your pipeline is flowing and some technology is sticking on site. A few weak spots kept you from the top.',
        medium: 'Some wins, but too much of your work stayed in pilots and slide decks. The drivers below show what held you back.',
        low: 'The board is not convinced. Innovation stayed a side show. The drivers below show where it went wrong.',
      };
      const headlines = { elite: 'You struck the mother lode.', high: 'You struck a rich vein.', medium: 'You found low-grade ore.', low: 'Your tenure went straight to tailings.' };
      const lastLog = S.log[S.log.length - 1];
      const nodes = Object.keys(E.NODES).map((k) => ({ k, v: S.nodes[k] })).sort((a, b) => b.v - a.v);
      const weakest = nodes.slice(-2).reverse();
      const verdict = (chosenImpact, impacts) => {
        const max = Math.max(...impacts);
        if (chosenImpact >= max - 1e-9) return '<span class="chip good">Strong call</span>';
        if (chosenImpact > 0) return '<span class="chip orange">Partial credit</span>';
        return '<span class="chip bad">Backfired</span>';
      };
      const bestOf = (items) => items.reduce((b, it) => (E.impact(it.e) > E.impact(b.e) ? it : b));
      const inits = S.funded.slice().sort((a, b) => a.year - b.year).map((f) => {
        const init = E.initById(f.id);
        const opt = init.opts[f.opt];
        const b = bestOf(init.opts);
        return `<div class="dec"><span class="what">${init.name}: ${opt.t} <span class="when">Year ${f.year}</span></span>${verdict(E.impact(opt.e), init.opts.map((o) => E.impact(o.e)))}
          <span class="why">${opt.n}${b !== opt ? ` Stronger choice: <b>${b.t}</b>.` : ''}</span></div>`;
      }).join('') || '<p>You did not fund any initiatives. Events alone cannot move a company.</p>';
      const events = S.log.map((l) => {
        const ev = E.eventById(l.event);
        const ch = ev.choices[l.choice];
        const b = bestOf(ev.choices);
        return `<div class="dec"><span class="what">${ev.title}: ${ch.t} <span class="when">Y${l.year} Q${l.quarter}</span></span>${verdict(E.impact(ch.e), ev.choices.map((c) => E.impact(c.e)))}
          <span class="why">${ch.r}${b !== ch ? ` Stronger choice: <b>${b.t}</b>.` : ''}</span></div>`;
      }).join('');
      return `<div class="wrap">${brandline()}
        <section class="screen stack-lg">
          <div class="score-hero">
            <div class="portrait">${mascot(S.companyId, fired || t.id === 'low' ? 'sad' : 'happy')}</div>
            <div class="stack">
              <span class="label">${fired ? `Board meeting · Year ${lastLog.year}, quarter ${lastLog.quarter}` : `${esc(S.player)} · Chief Innovation Officer scorecard`}</span>
              <h2>${fired ? 'Please hand back your hard hat.' : headlines[t.id]}</h2>
              <p>${fired ? 'Your metrics fell below what the board will accept and they have asked you to step aside. Luckily this was only a game. See what went wrong, then try again.' : verdicts[t.id]}</p>
              <div class="stats">
                <div><span class="label">${fired ? 'Average when fired' : 'Final score'}</span><span class="big">${Math.round(score)}%</span></div>
                <div><span class="label">Performance</span><span class="v">${fired ? 'Fired' : t.name}</span></div>
                <div><span class="label">Award</span><span class="v">${fired ? 'The Empty Core Tray' : t.award}</span></div>
                ${best ? `<div><span class="label">Your best at ${co().name}</span><span class="v">${Math.round(best)}%</span></div>` : ''}
              </div>
            </div>
          </div>
          <div class="section"><h3>Your ${fired ? 'tenure' : 'three years'}</h3>${chart(S.history)}</div>
          <div class="section">
            <h3>What drove your score</h3>
            <p>Eight hidden drivers sit behind the four metrics. Every initiative and decision moved some of them.</p>
            <div class="drivers">${nodes.map((n) => `<div class="drv" style="--c:${n.v >= 75 ? 'var(--orange)' : n.v >= 50 ? 'var(--amber)' : 'var(--m-buyin)'}"><span class="nm">${E.NODES[n.k]}</span><span class="num">${Math.round(n.v)}</span><div class="track"><div class="fill" style="width:${n.v}%"></div></div></div>`).join('')}</div>
            <div class="tips">${weakest.map((n) => `<div class="tip"><span class="label">Work on</span><b>${E.NODES[n.k]}</b><p>${E.NODE_TIPS[n.k]}</p></div>`).join('')}</div>
          </div>
          <div class="section"><h3>Your initiatives</h3><div class="decisions">${inits}</div></div>
          <div class="section"><h3>Your calls</h3><div class="decisions">${events}</div></div>
          <div class="cta">
            <img src="${LOGO_WHITE}" alt="Unearthed">
            <h2>Run open innovation on your own sites.</h2>
            <p>Unearthed connects you with a global ecosystem of innovators to solve your hardest operational challenges, then helps turn the best pilots into production.</p>
            <a class="btn outline-white" href="https://unearthed.solutions" target="_blank" rel="noopener">Talk to Unearthed</a>
          </div>
          <div class="row" style="justify-content:center"><button class="btn" data-a="again">Play again</button><button class="btn ghost" data-a="other">Try another company</button></div>
        </section></div>`;
    },
  };

  function modal() {
    const init = E.initById(V.modal);
    const cur = S.funded.find((f) => f.id === init.id && f.year === S.year);
    const avail = S.budget + (cur ? init.opts[cur.opt].c : 0);
    const order = init.opts.map((o, i) => ({ o, i })).sort((a, b) => a.o.c - b.o.c);
    const sel = V.pending;
    const tooDear = sel != null && init.opts[sel].c > avail + 1e-9;
    const ok = sel != null && !tooDear && !(cur && cur.opt === sel);
    return `<div class="overlay" data-a="closeBg"><div class="modal" data-a="noop" role="dialog" aria-modal="true" aria-labelledby="mtitle">
      <div class="modal-head"><span class="ic">${A.icon(init.icon)}</span><h2 id="mtitle">${init.name}</h2><button class="x" id="modal-close" data-a="close" aria-label="Close">×</button></div>
      <p>${init.desc}</p>
      <fieldset class="opts"><legend class="label" style="margin-bottom:8px">Choose your approach</legend>
        ${order.map(({ o, i }) => {
          const afford = o.c <= avail + 1e-9;
          const cost = o.c < 0 ? `+${money(o.c)} back` : o.c === 0 ? 'No cost' : money(o.c);
          return `<label class="opt ${sel === i ? 'sel' : ''} ${afford ? '' : 'no'}" for="opt-${init.id}-${i}"><input type="radio" name="opt" id="opt-${init.id}-${i}" value="${i}" ${sel === i ? 'checked' : ''}><span>${o.t}</span><span class="cost ${o.c < 0 ? 'back' : ''}">${cost}</span></label>`;
        }).join('')}
      </fieldset>
      ${tooDear ? `<p class="warn">Not enough budget for this option. You have ${money(avail)} to spend.</p>` : ''}
      <div class="row" style="justify-content:flex-end">
        ${cur ? '<button class="btn ghost" data-a="remove">Remove</button>' : ''}
        <button class="btn" data-a="confirm" ${ok ? '' : 'disabled'}>${cur ? 'Change approach' : 'Fund this'}</button>
      </div>
    </div></div>`;
  }

  // ---------- rendering and actions ----------

  function render(scroll) {
    const focusId = document.activeElement && document.activeElement.id;
    app.innerHTML = views[V.view]();
    if (scroll) window.scrollTo(0, 0);
    if (focusId && document.getElementById(focusId)) document.getElementById(focusId).focus({ preventScroll: true });
    else if (V.modal) {
      const first = app.querySelector('.modal input:checked') || app.querySelector('.modal input');
      if (first) first.focus({ preventScroll: true });
    }
  }

  function toEvent() {
    V.view = 'event';
    V.pending = null;
    V.order = E.shuffle([0, 1, 2]);
  }

  function newRun(companyId) {
    S = E.newGame(companyId, V.name.trim() || 'Explorer');
    V = { ...V, companyId, modal: null, pending: null, outcome: null, view: 'welcome' };
  }

  const actions = {
    start() { V.view = 'name'; return 'scroll'; },
    name() { if (!V.name.trim()) return false; V.view = 'company'; return 'scroll'; },
    company(el) { V.companyId = el.dataset.id; },
    accept() { if (!V.companyId) return false; newRun(V.companyId); return 'scroll'; },
    plan() { V.view = 'plan'; return 'scroll'; },
    card(el) {
      V.modal = el.dataset.id;
      const cur = S.funded.find((f) => f.id === V.modal && f.year === S.year);
      V.pending = cur ? cur.opt : null;
    },
    close() { V.modal = null; V.pending = null; },
    closeBg(el, e) { if (e.target !== el) return false; V.modal = null; V.pending = null; },
    noop() { return false; },
    confirm() {
      const id = V.modal;
      const cur = S.funded.find((f) => f.id === id && f.year === S.year);
      if (cur) E.unfund(S, id);
      if (!E.fund(S, id, V.pending) && cur) E.fund(S, id, cur.opt);
      V.modal = null; V.pending = null;
    },
    remove() { E.unfund(S, V.modal); V.modal = null; V.pending = null; },
    startYear() { E.startYear(S); toEvent(); return 'scroll'; },
    choose(el) { V.pending = +el.dataset.i; },
    lock() {
      if (V.pending == null) return false;
      const year = S.year, quarter = S.quarter;
      const r = E.playQuarter(S, V.pending);
      V.outcome = { ev: r.ev.id, choice: V.pending, before: r.before, after: r.after, year, quarter };
      V.view = 'outcome';
      if (S.status === 'done') store.set(S.companyId, E.avg(latest()));
      return 'scroll';
    },
    next() {
      if (S.status !== 'playing') V.view = 'end';
      else if (S.quarter === 0) V.view = 'plan';
      else toEvent();
      return 'scroll';
    },
    again() { newRun(S.companyId); return 'scroll'; },
    other() { S = null; V.companyId = null; V.view = 'company'; return 'scroll'; },
  };

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-a]');
    if (!el || !app.contains(el) || el.disabled) return;
    const res = actions[el.dataset.a]?.(el, e);
    if (res === false) return;
    render(res === 'scroll');
  });

  document.addEventListener('change', (e) => {
    if (e.target.name === 'opt') { V.pending = +e.target.value; render(); }
  });

  document.addEventListener('input', (e) => {
    if (e.target.id === 'player') {
      V.name = e.target.value;
      const b = document.getElementById('name-next');
      if (b) b.disabled = !V.name.trim();
    }
  });

  document.addEventListener('submit', (e) => {
    e.preventDefault();
    if (e.target.id === 'nameform' && actions.name() !== false) render(true);
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && V.modal) { V.modal = null; V.pending = null; render(); }
  });

  // Keep a game in progress across live updates of the page.
  try { window.claude?.hot?.snapshot?.(() => ({ S, V })); } catch { /* not in a viewer */ }
  const boot = (data) => {
    if (data && data.V && data.V.view) { S = data.S; V = data.V; }
    render();
  };
  if (window.claude?.hot?.ready) window.claude.hot.ready(boot);
  else boot(window.claude?.hot?.data ?? {});
})();

</script>
