<title>Innovation Rush</title>
<meta name="description" content="Lead open innovation at a mining company for three years. A game by Unearthed.">
<style>
/* Layout: a single centred column app. Title scene is an open-pit cross-section; in-game a sticky HUD tracks the 12 quarters as pit benches. */
/* Unearthed brand (unearthed-style): white ground, Arial only, orange headlines, grey body, max three oranges per element, no gradients on UI. Deliberately single light theme per brand guide. */
:root {
  --orange: #FF6600;
  --amber: #FFA627;
  --tangerine: #FC883F;
  --peach: #F8CA8A;
  --peach-soft: #FDEFDC;
  --ink: #333333;
  --grey: #656565;
  --muted: #656565;
  --line: #E0E0E0;
  --bg: #FFFFFF;
  --bg-alt: #F5F5F5;
  --good: #23784A;
  --good-soft: #E6F3EB;
  --bad: #C0392B;
  --bad-soft: #FBEAE8;
  --m-eco: #FF6600;
  --m-adopt: #333333;
  --m-value: #FFA627;
  --m-buyin: #656565;
  --font: Arial, Helvetica, sans-serif;
  --radius: 14px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--grey); }
body { margin: 0; border-top: 5px solid var(--orange); font-family: var(--font); font-size: 16px; line-height: 1.55; padding-inline: 16px; padding-block: 0 48px; }
h1, h2, h3 { font-family: var(--font); font-weight: 700; color: var(--ink); letter-spacing: -0.02em; line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2.4rem, 7vw, 4rem); color: var(--orange); letter-spacing: -0.035em; }
h2 { font-size: clamp(1.6rem, 4vw, 2.25rem); color: var(--orange); letter-spacing: -0.01em; }
h3 { font-size: 1.1rem; }
p { margin: 0; max-width: 62ch; }
.label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }
.wrap { max-width: 1080px; margin: 0 auto; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-lg { display: flex; flex-direction: column; gap: 28px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.center { text-align: center; align-items: center; }
.center p { margin-inline: auto; }
.screen { padding-block: 32px; animation: rise .35s ease both; }
@keyframes rise { from { transform: translateY(6px); } to { transform: none; } }

button { font-family: var(--font); font-size: 1rem; cursor: pointer; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 999px; padding: 14px 28px; font-weight: 700; background: var(--orange); color: #fff; min-width: 200px; transition: background .15s, transform .1s; }
.btn:hover { background: #E85C00; }
.btn:active { transform: translateY(1px); }
.btn:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--orange); box-shadow: inset 0 0 0 2px var(--orange); }
.btn.ghost:hover { background: var(--peach-soft); }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
a { color: var(--orange); font-weight: 700; }

/* Title scene */
.brandline { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 20px; border-bottom: 1px solid var(--line); }
.logo { display: inline-flex; }
.logo img { height: 40px; width: auto; display: block; }
.gamename { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--grey); }
.gamename b { color: var(--orange); }
.scene { position: relative; width: 100%; max-width: 820px; margin: 8px auto 0; aspect-ratio: 800 / 220; }
.scene .pit { position: absolute; inset: 0; width: 100%; height: 100%; }
.scene .m { position: absolute; }
.scene .m svg { width: 100%; height: auto; display: block; }
.m-nugget { left: 22.5%; bottom: 48.5%; width: 11.25%; animation: bob 3.2s ease-in-out infinite; }
.m-mammoth { left: 41.9%; bottom: 30.5%; width: 16.25%; animation: bob 3.8s ease-in-out .4s infinite; }
.m-truck { left: 64.4%; bottom: 48.5%; width: 15%; animation: bob 3.5s ease-in-out .8s infinite; }
@keyframes bob { 50% { transform: translateY(-4%); } }
.hero { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 32px; align-items: end; padding-block: 24px 0; }
.hero .lede { font-size: 1.15rem; }
.hero .side { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.statrow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; border-top: 1px solid var(--line); padding-top: 28px; }
.statrow div { display: flex; flex-direction: column; gap: 4px; }
.stat { font-size: clamp(2.6rem, 6vw, 4rem); font-weight: 700; color: var(--orange); line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; }
.step { display: flex; flex-direction: column; gap: 6px; }
.step .n { font-size: 2.25rem; font-weight: 700; color: var(--orange); line-height: 1; letter-spacing: -0.02em; }
.step b { color: var(--ink); font-size: 1.05rem; }

.field { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 420px; text-align: left; }
.field label { font-weight: 700; color: var(--ink); }
.field input { font: inherit; font-size: 1.1rem; padding: 14px 16px; border: 2px solid var(--line); border-radius: 12px; color: var(--ink); background: var(--bg); }
.field input:focus { border-color: var(--orange); outline: none; }
.hint { font-size: 0.85rem; color: var(--muted); }

/* Company choice */
.companies { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 16px; }
.company { text-align: left; background: var(--bg); border: 2px solid var(--line); border-radius: var(--radius); padding: 0; overflow: hidden; display: flex; flex-direction: column; transition: border-color .15s, transform .15s; color: inherit; }
.company:hover { border-color: var(--peach); transform: translateY(-2px); }
.company[aria-pressed="true"] { border-color: var(--orange); box-shadow: 0 0 0 3px var(--peach-soft); }
.company .portrait { background: var(--peach-soft); display: grid; place-items: center; padding: 18px; height: 150px; }
.company .portrait svg { height: 112px; width: auto; }
.company .body { padding: 16px 18px 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.company h3 { color: var(--ink); }
.company .facts { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 0.78rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--bg-alt); color: var(--grey); }
.chip.orange { background: var(--peach-soft); color: #B84A00; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }

/* Welcome */
.letter { display: grid; grid-template-columns: 140px 1fr; gap: 24px; align-items: start; }
.letter .portrait svg { width: 140px; height: auto; }
.letter .copy { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.metric-legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 12px; }
.metric-legend div { display: flex; flex-direction: column; gap: 2px; padding-left: 12px; border-left: 4px solid var(--c); }
.metric-legend b { color: var(--ink); }

/* HUD */
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); margin-inline: -16px; padding: 10px 16px; }
.hud-inner { max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: auto 1fr auto; gap: 8px 20px; align-items: center; }
.hud .who { display: flex; gap: 10px; align-items: center; min-width: 0; }
.hud .who svg { width: 46px; height: 40px; flex: none; }
.hud .who .name { font-weight: 700; color: var(--ink); font-size: 0.95rem; line-height: 1.2; }
.hud .who .co { font-size: 0.8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.benches { display: flex; align-items: flex-start; gap: 3px; justify-self: center; }
.bench-year { display: flex; flex-direction: column; gap: 3px; align-items: center; }
.bench-year .ql { display: flex; gap: 3px; align-items: flex-start; }
.bench { width: 16px; height: 8px; border-radius: 2px; background: var(--bg-alt); border: 1px solid var(--line); }
.bench.done { background: var(--peach); border-color: var(--peach); }
.bench.now { background: var(--orange); border-color: var(--orange); }
.bench-year .yl { font-size: 0.65rem; font-weight: 700; color: var(--muted); letter-spacing: 0.08em; }
.budget { display: flex; flex-direction: column; gap: 4px; min-width: 150px; }
.budget .amt { font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; font-size: 0.95rem; }
.budget .amt small { color: var(--muted); font-weight: 400; }
.track { position: relative; height: 8px; border-radius: 999px; background: var(--bg-alt); overflow: hidden; }
.track .fill { position: absolute; inset: 0 auto 0 0; background: var(--orange); border-radius: 999px; transition: width .4s ease; }
.track .ghost { position: absolute; inset: 0 auto 0 0; background: var(--peach); border-radius: 999px; transition: width .2s; }
.minimetrics { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.mm { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.mm .top { display: flex; justify-content: space-between; font-size: 0.75rem; font-weight: 700; color: var(--ink); gap: 4px; }
.mm .top span:last-child { font-variant-numeric: tabular-nums; color: var(--grey); }
.mm .track .fill { background: var(--c); }

/* Planning */
.plan-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: end; }
.notice { background: var(--peach-soft); border-radius: 12px; padding: 14px 16px; color: #7A3A00; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(210px, 100%), 1fr)); gap: 12px; }
.card { text-align: left; background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; padding: 14px; display: flex; gap: 12px; align-items: flex-start; color: inherit; transition: border-color .15s, background .15s; }
.card:hover:not(:disabled) { border-color: var(--tangerine); }
.card .ic { flex: none; width: 40px; height: 40px; border-radius: 10px; background: var(--peach-soft); color: var(--orange); display: grid; place-items: center; }
.card .ic .icon { width: 22px; height: 22px; }
.card .txt { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.card .nm { font-weight: 700; color: var(--ink); line-height: 1.25; }
.pips { font-size: 0.8rem; font-weight: 700; letter-spacing: 0.05em; color: var(--orange); }
.pips i { font-style: normal; color: var(--line); }
.card.funded { background: var(--peach-soft); border-color: var(--orange); }
.card.funded .ic { background: var(--orange); color: #fff; }
.card .pick { font-size: 0.85rem; color: #7A3A00; }
.card.locked { background: var(--bg-alt); border-style: dashed; }
.card.locked .ic { background: var(--line); color: var(--grey); }
.card.locked .pick { color: var(--grey); }
.card:disabled { cursor: default; }
.card.dim { opacity: .5; }
.dock { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); margin-inline: -16px; padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); margin-top: 24px; }
.dock-inner { max-width: 1080px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
.slots { display: flex; gap: 6px; align-items: center; }
.slot { width: 14px; height: 14px; border-radius: 4px; border: 2px solid var(--orange); }
.slot.on { background: var(--orange); }

/* Modal */
.overlay { position: fixed; inset: 0; background: rgba(51, 51, 51, .45); display: grid; place-items: center; padding: 16px; z-index: 20; animation: fade .15s ease; }
@keyframes fade { from { opacity: 0; } }
.modal { background: var(--bg); border-radius: 18px; width: 100%; max-width: 560px; max-height: calc(100% - 32px); overflow: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
.modal-head { display: flex; gap: 12px; align-items: center; }
.modal-head .ic { width: 44px; height: 44px; border-radius: 12px; background: var(--peach-soft); color: var(--orange); display: grid; place-items: center; flex: none; }
.modal-head .ic .icon { width: 24px; height: 24px; }
.modal-head h2 { font-size: 1.4rem; flex: 1; }
.x { background: var(--bg-alt); border: 0; border-radius: 999px; width: 36px; height: 36px; font-size: 1.2rem; color: var(--grey); flex: none; }
.opts { display: flex; flex-direction: column; gap: 8px; border: 0; margin: 0; padding: 0; }
.opt { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; cursor: pointer; color: var(--ink); }
.opt:hover { border-color: var(--tangerine); }
.opt input { accent-color: var(--orange); width: 18px; height: 18px; margin: 0; }
.opt .cost { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--grey); font-size: 0.9rem; white-space: nowrap; }
.opt .cost.back { color: var(--good); }
.opt.sel { border-color: var(--orange); background: var(--peach-soft); }
.opt.no { opacity: .55; }
.warn { color: var(--bad); font-weight: 700; font-size: 0.9rem; }

/* Event + outcome */
.panel { border: 1.5px solid var(--line); border-radius: 18px; padding: clamp(20px, 4vw, 36px); display: flex; flex-direction: column; gap: 18px; }
.panel .lead { font-size: 1.1rem; color: var(--ink); }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choice { text-align: left; padding: 16px 18px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); font-weight: 700; line-height: 1.35; transition: border-color .15s, background .15s; }
.choice:hover { border-color: var(--tangerine); }
.choice[aria-pressed="true"] { border-color: var(--orange); background: var(--peach-soft); }
.quote { border-left: 4px solid var(--orange); padding-left: 16px; color: var(--ink); font-size: 1.1rem; }
.deltas { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.delta { border-radius: 12px; background: var(--bg-alt); padding: 12px; display: flex; flex-direction: column; gap: 2px; border-top: 4px solid var(--c); min-width: 0; }
.delta .v { font-size: 1.6rem; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.1; }
.delta .d { font-weight: 700; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.d.up { color: var(--good); } .d.down { color: var(--bad); } .d.flat { color: var(--muted); }
.delta .t { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }

.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--font); font-size: 11px; fill: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.85rem; color: var(--ink); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 18px; height: 3px; border-radius: 2px; background: var(--c); display: inline-block; }
.legend i.dash { background: none; border-top: 3px dashed var(--c); height: 0; }

/* Scorecard */
.score-hero { display: grid; grid-template-columns: 180px 1fr; gap: 28px; align-items: center; }
.score-hero .portrait svg { width: 180px; height: auto; }
.big { font-size: clamp(3.5rem, 12vw, 5.5rem); font-weight: 700; color: var(--orange); line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.stats { display: flex; flex-wrap: wrap; gap: 28px; }
.stats > div { display: flex; flex-direction: column; gap: 4px; }
.stats .v { font-size: 1.6rem; font-weight: 700; color: var(--ink); }
.section { border-top: 1px solid var(--line); padding-top: 28px; display: flex; flex-direction: column; gap: 16px; }
.drivers { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 10px 32px; }
.drv { display: grid; grid-template-columns: 1fr 44px; gap: 4px 10px; align-items: center; }
.drv .nm { font-weight: 700; color: var(--ink); font-size: 0.92rem; }
.drv .num { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--grey); }
.drv .track { grid-column: 1 / -1; }
.drv .track .fill { background: var(--c, var(--orange)); }
.tips { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 12px; }
.tip { background: var(--peach-soft); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.tip b { color: var(--ink); }
.decisions { display: flex; flex-direction: column; }
.dec { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.dec .what { color: var(--ink); font-weight: 700; }
.dec .why { grid-column: 1 / -1; font-size: 0.92rem; }
.dec .when { font-size: 0.8rem; color: var(--muted); font-weight: 400; }
.cta { background: var(--orange); color: #fff; border-radius: 18px; padding: clamp(24px, 5vw, 40px); display: flex; flex-direction: column; gap: 12px; }
.cta h2 { color: #fff; }
.cta p { color: #fff; }
.cta img { height: 36px; width: auto; align-self: flex-start; filter: brightness(0) invert(1); }
.btn.outline-white { background: transparent; color: #fff; box-shadow: inset 0 0 0 2px #fff; text-decoration: none; align-self: flex-start; }
.btn.outline-white:hover { background: rgba(255, 255, 255, .12); }

@media (max-width: 640px) {
  .hud-inner { grid-template-columns: 1fr auto; }
  .benches { grid-column: 1 / -1; grid-row: 2; justify-self: start; }
  .budget { min-width: 120px; }
  .minimetrics { gap: 8px; }
  .deltas { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .letter, .score-hero, .hero { grid-template-columns: 1fr; }
  .statrow, .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .logo img { height: 28px; }
  .letter .portrait svg { width: 110px; }
  .score-hero .portrait svg { width: 130px; }
  .btn { width: 100%; }
  .dock .btn { width: auto; min-width: 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
