<title>Innovation Rush</title>
<meta name="description" content="Lead open innovation at a mining company for three years. A game by Unearthed.">
<style>
/* Layout: matches unearthed.solutions. Split hero (text left, grey image panel right), light-weight near-black headlines,
   small sentence-case text, outlined pill buttons with an orange arrow, hairline cards. Orange is an accent, not a fill.
   In-game a sticky HUD tracks the 12 quarters as pit benches. Deliberately single light theme, as on the brand site. */
:root {
  --orange: #FF6600;
  --amber: #FFA627;
  --tangerine: #FC883F;
  --peach: #F8CA8A;
  --peach-soft: #FFF7EF;
  --ink: #282726;
  --grey: #656565;
  --muted: #8C8986;
  --line: #E6E4E1;
  --line-strong: #CFCAC5;
  --bg: #FFFFFF;
  --panel: #F3F2F0;
  --good: #23784A;
  --bad: #C0392B;
  --m-eco: #FF6600;
  --m-adopt: #282726;
  --m-value: #FFA627;
  --m-buyin: #8C8986;
  --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font-family: var(--font); font-size: 15px; line-height: 1.6; padding-inline: 20px; padding-block: 0 56px; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--font); color: var(--ink); margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2.6rem, 6vw, 4.4rem); font-weight: 300; line-height: 1.05; letter-spacing: -0.025em; }
h2 { font-size: clamp(1.7rem, 3.6vw, 2.5rem); font-weight: 300; line-height: 1.15; letter-spacing: -0.015em; }
h3 { font-size: 1.05rem; font-weight: 600; line-height: 1.3; }
p { margin: 0; max-width: 62ch; color: var(--grey); }
b { color: var(--ink); font-weight: 600; }
.label { font-size: 0.85rem; color: var(--muted); }
.wrap { max-width: 1160px; margin: 0 auto; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.stack-lg { display: flex; flex-direction: column; gap: 40px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.screen { padding-block: 36px; animation: rise .35s ease both; }
@keyframes rise { from { transform: translateY(6px); } to { transform: none; } }

button { font-family: var(--font); font-size: 1rem; cursor: pointer; }
a { color: var(--ink); }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }

/* Pill buttons, as on unearthed.solutions */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border: 1px solid var(--orange); border-radius: 999px; padding: 11px 22px; font-weight: 600; font-size: 0.95rem; background: var(--bg); color: var(--ink); text-decoration: none; transition: background .15s, border-color .15s; }
.btn::after { content: "→"; color: var(--orange); font-weight: 400; transition: transform .15s; }
.btn:hover { background: var(--peach-soft); }
.btn:hover::after { transform: translateX(3px); }
.btn:disabled { border-color: var(--line); color: var(--muted); cursor: not-allowed; background: var(--bg); }
.btn:disabled::after { color: var(--line-strong); }
.btn.ghost { border-color: var(--line-strong); }
.btn.ghost::after { content: none; }
.btn.ghost:hover { border-color: var(--ink); background: var(--bg); }

/* Header */
.brandline { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 22px; }
.logo { display: inline-flex; }
.logo img { height: 30px; width: auto; display: block; }
.gamename { font-size: 0.85rem; color: var(--grey); }
.gamename b { color: var(--ink); }

/* Title: split hero */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 48px; align-items: stretch; }
.hero .copy { display: flex; flex-direction: column; justify-content: space-between; gap: 40px; padding-block: 24px 8px; }
.hero .lede { font-size: 1.05rem; }
.hero .cta-row { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
.photo { position: relative; background: var(--panel); border-radius: 20px; overflow: hidden; min-height: 460px; display: flex; flex-direction: column; justify-content: flex-end; }
.photo .float { position: absolute; top: 24px; left: 24px; right: 24px; max-width: 300px; background: var(--bg); border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 8px 24px rgba(40, 39, 38, .08); }
.photo .float p { font-size: 0.85rem; }
.scene { position: relative; width: 100%; aspect-ratio: 800 / 220; }
.scene .pit { position: absolute; inset: 0; width: 100%; height: 100%; }
.scene .m { position: absolute; }
.scene .m svg { width: 100%; height: auto; display: block; }
.m-nugget { left: 22.5%; bottom: 48.5%; width: 11.25%; animation: bob 3.2s ease-in-out infinite; }
.m-rock { left: 41.9%; bottom: 31%; width: 16.25%; animation: bob 3.8s ease-in-out .4s infinite; }
.m-truck { left: 64.4%; bottom: 48.5%; width: 15%; animation: bob 3.5s ease-in-out .8s infinite; }
@keyframes bob { 50% { transform: translateY(-4%); } }
.statrow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; border-top: 1px solid var(--line); padding-top: 28px; }
.statrow div { display: flex; flex-direction: column; gap: 4px; }
.statrow span:last-child { font-size: 0.9rem; color: var(--grey); }
.stat { font-size: clamp(2.4rem, 5vw, 3.4rem); font-weight: 300; color: var(--ink); line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }

.field { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 420px; }
.field label { font-weight: 600; }
.field input { font: inherit; font-size: 1.05rem; padding: 12px 16px; border: 1px solid var(--line-strong); border-radius: 999px; color: var(--ink); background: var(--bg); }
.field input:focus { border-color: var(--orange); outline: none; }
.hint { font-size: 0.85rem; color: var(--muted); }

/* Company choice */
.companies { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 20px; }
.company { text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 20px; padding: 8px; display: flex; flex-direction: column; color: inherit; transition: border-color .15s; }
.company:hover { border-color: var(--line-strong); }
.company[aria-pressed="true"] { border-color: var(--orange); }
.company .portrait { background: var(--panel); border-radius: 14px; display: grid; place-items: center; height: 170px; }
.company .portrait svg { height: 116px; width: auto; }
.company .body { padding: 16px 12px 14px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.company .facts { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; font-size: 0.78rem; font-weight: 600; padding: 3px 11px; border-radius: 999px; border: 1px solid var(--line); color: var(--grey); background: var(--bg); white-space: nowrap; }
.chip.orange { border-color: var(--peach); color: #B84A00; }
.chip.good { border-color: #BFDCCB; color: var(--good); }
.chip.bad { border-color: #EBC2BD; color: var(--bad); }

/* Welcome */
.letter { display: grid; grid-template-columns: 150px 1fr; gap: 32px; align-items: start; }
.letter .portrait { background: var(--panel); border-radius: 16px; padding: 18px; }
.letter .portrait svg { width: 100%; height: auto; display: block; }
.letter .copy { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 28px; border-top: 1px solid var(--line); padding-top: 24px; }
.step { display: flex; flex-direction: column; gap: 6px; }
.step .n { font-size: 0.85rem; font-weight: 600; color: var(--orange); font-variant-numeric: tabular-nums; }
.step span:last-child { color: var(--grey); font-size: 0.92rem; }
.metric-legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 16px; }
.metric-legend div { display: flex; flex-direction: column; gap: 2px; padding-left: 12px; border-left: 2px solid var(--c); }
.metric-legend span { color: var(--grey); font-size: 0.92rem; }

/* HUD */
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: rgba(255, 255, 255, .96); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); margin-inline: -20px; padding: 12px 20px; }
.hud-inner { max-width: 1160px; margin: 0 auto; display: grid; grid-template-columns: auto 1fr auto; gap: 10px 24px; align-items: center; }
.hud .who { display: flex; gap: 10px; align-items: center; min-width: 0; }
.hud .who svg { width: 46px; height: 40px; flex: none; }
.hud .who .name { font-weight: 600; font-size: 0.95rem; line-height: 1.2; }
.hud .who .co { font-size: 0.8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.benches { display: flex; align-items: flex-start; gap: 4px; justify-self: center; }
.bench-year { display: flex; flex-direction: column; gap: 4px; align-items: center; }
.bench-year .ql { display: flex; gap: 3px; align-items: flex-start; }
.bench { width: 16px; height: 7px; border-radius: 2px; background: var(--bg); border: 1px solid var(--line-strong); }
.bench.done { background: var(--peach); border-color: var(--peach); }
.bench.now { background: var(--orange); border-color: var(--orange); }
.bench-year .yl { font-size: 0.68rem; color: var(--muted); }
.budget { display: flex; flex-direction: column; gap: 5px; min-width: 160px; }
.budget .amt { font-weight: 600; font-variant-numeric: tabular-nums; font-size: 0.95rem; }
.budget .amt small { color: var(--muted); font-weight: 400; }
.track { position: relative; height: 4px; border-radius: 999px; background: var(--line); overflow: hidden; }
.track .fill { position: absolute; inset: 0 auto 0 0; background: var(--orange); border-radius: 999px; transition: width .4s ease; }
.track .ghost { position: absolute; inset: 0 auto 0 0; background: var(--peach); border-radius: 999px; transition: width .2s; }
.minimetrics { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.mm { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.mm .top { display: flex; justify-content: space-between; font-size: 0.78rem; gap: 4px; }
.mm .top span:first-child { color: var(--grey); }
.mm .top span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }
.mm .track .fill { background: var(--c); }

/* Planning */
.plan-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: end; }
.notice { border-left: 2px solid var(--orange); padding: 2px 0 2px 16px; color: var(--grey); max-width: 70ch; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr)); gap: 12px; }
.card { text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; gap: 14px; align-items: flex-start; color: inherit; transition: border-color .15s; }
.card:hover:not(:disabled) { border-color: var(--line-strong); }
.card .ic { flex: none; width: 24px; height: 24px; color: var(--grey); margin-top: 1px; }
.card .ic .icon { width: 24px; height: 24px; display: block; }
.card .txt { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.card .nm { font-weight: 600; line-height: 1.3; }
.pips { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.04em; color: var(--ink); }
.pips i { font-style: normal; color: var(--line-strong); }
.card.funded { border-color: var(--orange); }
.card.funded .ic { color: var(--orange); }
.card .pick { font-size: 0.85rem; color: var(--grey); }
.card .state { font-size: 0.78rem; color: var(--orange); font-weight: 600; }
.card.locked { background: var(--panel); border-color: var(--panel); }
.card.locked .state { color: var(--muted); }
.card:disabled { cursor: default; }
.card.dim { opacity: .45; }
.dock { position: sticky; bottom: 0; background: rgba(255, 255, 255, .96); backdrop-filter: blur(6px); border-top: 1px solid var(--line); margin-inline: -20px; padding: 14px 20px calc(14px + env(safe-area-inset-bottom, 0px)); margin-top: 28px; }
.dock-inner { max-width: 1160px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
.dock-inner > .row span { color: var(--grey); font-size: 0.92rem; }
.slots { display: flex; gap: 5px; align-items: center; }
.slot { width: 10px; height: 10px; border-radius: 999px; border: 1px solid var(--orange); }
.slot.on { background: var(--orange); }

/* Modal */
.overlay { position: fixed; inset: 0; background: rgba(40, 39, 38, .4); display: grid; place-items: center; padding: 20px; z-index: 20; animation: fade .15s ease; }
@keyframes fade { from { opacity: 0; } }
.modal { background: var(--bg); border-radius: 20px; width: 100%; max-width: 580px; max-height: calc(100% - 40px); overflow: auto; padding: 28px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 24px 64px rgba(40, 39, 38, .18); }
.modal-head { display: flex; gap: 12px; align-items: center; }
.modal-head .ic { color: var(--orange); flex: none; }
.modal-head .ic .icon { width: 26px; height: 26px; display: block; }
.modal-head h2 { font-size: 1.6rem; flex: 1; }
.x { background: var(--bg); border: 1px solid var(--line); border-radius: 999px; width: 36px; height: 36px; font-size: 1.1rem; color: var(--grey); flex: none; }
.opts { display: flex; flex-direction: column; gap: 8px; border: 0; margin: 0; padding: 0; }
.opts legend { margin-bottom: 8px; }
.opt { display: grid; grid-template-columns: 20px 1fr auto; gap: 12px; align-items: center; padding: 12px 16px; border: 1px solid var(--line); border-radius: 14px; cursor: pointer; }
.opt:hover { border-color: var(--line-strong); }
.opt input { accent-color: var(--orange); width: 16px; height: 16px; margin: 0; }
.opt .cost { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--grey); font-size: 0.88rem; white-space: nowrap; }
.opt .cost.back { color: var(--good); }
.opt.sel { border-color: var(--orange); background: var(--peach-soft); }
.opt.no { opacity: .5; }
.warn { color: var(--bad); font-size: 0.9rem; }

/* Event + outcome */
.panel { border: 1px solid var(--line); border-radius: 20px; padding: clamp(22px, 4vw, 40px); display: flex; flex-direction: column; gap: 20px; }
.panel .lead { font-size: 1.1rem; color: var(--ink); }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choice { text-align: left; padding: 16px 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); color: var(--ink); line-height: 1.4; transition: border-color .15s, background .15s; }
.choice:hover { border-color: var(--line-strong); }
.choice[aria-pressed="true"] { border-color: var(--orange); background: var(--peach-soft); }
.quote { border-left: 2px solid var(--orange); padding-left: 18px; color: var(--ink); font-size: 1.35rem; font-weight: 300; line-height: 1.4; }
.deltas { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.delta { border-radius: 14px; background: var(--panel); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; position: relative; overflow: hidden; }
.delta::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; background: var(--c); }
.delta .v { font-size: 2rem; font-weight: 300; font-variant-numeric: tabular-nums; line-height: 1.1; }
.delta .d { font-weight: 600; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.d.up { color: var(--good); } .d.down { color: var(--bad); } .d.flat { color: var(--muted); }
.delta .t { font-size: 0.8rem; color: var(--grey); }

.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--font); font-size: 11px; fill: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.85rem; color: var(--grey); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 18px; height: 2px; background: var(--c); display: inline-block; }
.legend i.dash { background: none; border-top: 2px dashed var(--c); height: 0; }

/* Scorecard */
.score-hero { display: grid; grid-template-columns: 200px 1fr; gap: 36px; align-items: center; }
.score-hero .portrait { background: var(--panel); border-radius: 20px; padding: 24px; }
.score-hero .portrait svg { width: 100%; height: auto; display: block; }
.big { font-size: clamp(3.6rem, 11vw, 6rem); font-weight: 300; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.big small { font-size: 0.45em; color: var(--orange); letter-spacing: 0; }
.stats { display: flex; flex-wrap: wrap; gap: 36px; align-items: flex-end; }
.stats > div { display: flex; flex-direction: column; gap: 4px; }
.stats .v { font-size: 1.5rem; font-weight: 300; }
.section { border-top: 1px solid var(--line); padding-top: 32px; display: flex; flex-direction: column; gap: 18px; }
.drivers { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 14px 36px; }
.drv { display: grid; grid-template-columns: 1fr 44px; gap: 6px 10px; align-items: center; }
.drv .nm { font-size: 0.92rem; }
.drv .num { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.drv .track { grid-column: 1 / -1; }
.drv .track .fill { background: var(--c, var(--orange)); }
.tips { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 12px; }
.tip { background: var(--panel); border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; }
.decisions { display: flex; flex-direction: column; }
.dec { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 14px 0; border-bottom: 1px solid var(--line); align-items: start; }
.dec .what { font-weight: 600; }
.dec .why { grid-column: 1 / -1; font-size: 0.92rem; color: var(--grey); }
.dec .when { font-size: 0.8rem; color: var(--muted); font-weight: 400; }
.cta { background: var(--panel); border-radius: 20px; padding: clamp(28px, 5vw, 48px); display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 24px 48px; align-items: end; }
.cta .stack { gap: 16px; }
.cta img { height: 30px; width: auto; align-self: flex-start; }
.cta .actions { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
.email { font-size: 0.88rem; color: var(--grey); display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.email .addr { color: var(--ink); font-weight: 600; user-select: all; }
.copy-btn { font: inherit; font-size: 0.8rem; font-weight: 600; border: 1px solid var(--line-strong); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 3px 12px; }
.copy-btn:hover { border-color: var(--ink); }

/* Unearthed plan on the scorecard */
.plan { gap: 28px; }
.stages { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.stages li { position: relative; display: flex; flex-direction: column; gap: 2px; padding: 14px 22px 14px 18px; background: var(--panel); color: var(--muted); clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%, 12px 50%); }
.stages li:first-child { clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%); border-radius: 12px 0 0 12px; }
.stages li .n { font-size: 0.75rem; font-weight: 600; }
.stages li b { color: inherit; font-size: 0.95rem; }
.stages li span:last-child { font-size: 0.78rem; line-height: 1.35; }
.stages li.on { background: var(--orange); color: #fff; }
.stages li.on b { color: #fff; }
.helps { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); gap: 16px; }
.help { border: 1px solid var(--line); border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; }
.help-top { padding: 20px 22px 16px; display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid var(--line); }
.help-top h3 { font-size: 1.3rem; font-weight: 300; }
.hurt { font-size: 0.88rem; margin-top: 6px; }
.hurt .when { color: var(--muted); font-size: 0.8rem; }
.help-body { padding: 18px 22px 22px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.help-body .form { font-size: 1.05rem; color: var(--orange); }
.help-body p { color: var(--ink); }
.help dl { margin: 6px 0 0; display: grid; gap: 8px; }
.help dl div { display: grid; grid-template-columns: 120px 1fr; gap: 12px; font-size: 0.85rem; }
.help dt { color: var(--muted); }
.help dd { margin: 0; color: var(--grey); }
.chip.u { border-color: var(--orange); color: var(--orange); margin-left: 4px; }
details.more { border-top: 1px solid var(--line); padding-top: 24px; }
details.more summary { cursor: pointer; font-weight: 600; list-style: none; display: inline-flex; align-items: center; gap: 10px; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::after { content: "+"; color: var(--orange); font-weight: 400; font-size: 1.2rem; }
details.more[open] summary::after { content: "−"; }
details.more[open] summary { margin-bottom: 24px; }

@media (max-width: 760px) {
  body { padding-inline: 16px; }
  .hud, .dock { margin-inline: -16px; padding-inline: 16px; }
  .hero, .letter, .score-hero, .cta { grid-template-columns: 1fr; }
  .photo { min-height: 320px; }
  .hud-inner { grid-template-columns: 1fr auto; }
  .benches { grid-column: 1 / -1; grid-row: 2; justify-self: start; }
  .budget { min-width: 120px; }
  .minimetrics { gap: 10px; }
  .deltas, .statrow, .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .letter .portrait { width: 120px; }
  .score-hero .portrait { width: 150px; }
  .cta .actions { align-items: flex-start; }
  .stages { grid-template-columns: 1fr; }
  .stages li, .stages li:first-child { clip-path: none; border-radius: 10px; }
